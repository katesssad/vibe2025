<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }
        #todoList {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #todoList th, #todoList td {
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            text-align: left;
        }
        #todoList th {
            background-color: #4a6fa5;
            color: white;
            font-weight: normal;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 8%;
        }
        #todoList th:nth-child(2) {
            width: 84%;
        }
        #todoList tr:nth-child(even) {
            background-color: #f5f5f5;
        }
        #todoList tr:hover {
            background-color: #ebebeb;
        }
        .action-btn {
            cursor: pointer;
            background: #f0f0f0;
            color: #555;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            font-weight: bold;
            text-align: center;
            line-height: 24px;
            display: inline-block;
            margin: 0 3px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        .delete-btn {
            color: #ff5555;
            border-color: #ffaaaa;
        }
        .edit-btn {
            color: #5555ff;
            border-color: #aaaaff;
        }
        .add-form {
            margin-top: 25px;
            width: 80%;
            margin: 25px auto;
            display: flex;
            gap: 10px;
        }
        .add-form input[type="text"] {
            padding: 10px;
            width: 75%;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .add-form button {
            padding: 10px;
            width: 25%;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .add-form button:hover {
            background-color: #3a5a8f;
        }
        .edit-input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        h2 {
            color: #333;
            margin-top: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add Item</button>
</div>

<script>
    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (!newItemText) return;

        try {
            const response = await fetch('/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `text=${encodeURIComponent(newItemText)}`
            });

            const result = await response.json();
            if (result.success) {
                newItemInput.value = '';
                window.location.reload();
            } else {
                alert('Failed to add item: ' + (result.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to add item');
        }
    }

    async function removeItem(id) {
        if (confirm('Are you sure you want to delete this item?')) {
            try {
                const response = await fetch('/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `id=${id}`
                });

                const result = await response.json();
                if (result.success) {
                    window.location.reload();
                } else {
                    alert('Failed to delete item: ' + (result.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete item');
            }
        }
    }

    function enableEdit(id) {
        const textCell = document.querySelector(`td.item-text[data-id="${id}"]`);
        const currentText = textCell.textContent;
        
        textCell.innerHTML = `
            <input type="text" class="edit-input" value="${currentText.replace(/"/g, '&quot;')}" 
                   onkeydown="handleEditKey(event, ${id})">
        `;
        textCell.querySelector('input').focus();
    }

    function handleEditKey(event, id) {
        if (event.key === 'Enter') {
            saveEdit(id);
        } else if (event.key === 'Escape') {
            window.location.reload();
        }
    }

    async function saveEdit(id) {
        const input = document.querySelector(`td.item-text[data-id="${id}"] input`);
        const newText = input.value.trim();

        if (!newText) {
            alert('Text cannot be empty');
            return;
        }

        try {
            const response = await fetch('/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `id=${id}&text=${encodeURIComponent(newText)}`
            });

            const result = await response.json();
            if (result.success) {
                window.location.reload();
            } else {
                alert('Failed to update item: ' + (result.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to update item');
        }
    }
</script>

</body>
</html>
