<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
        .edit-input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new item">
    <button onclick="addItem()">Add</button>
</div>

<script>
    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            try {
                const response = await fetch('/items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newItemText })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to add item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error adding item');
            }
        }
    }

    async function deleteItem(id) {
        if (confirm('Are you sure you want to delete this item?')) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to delete item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting item');
            }
        }
    }

    function enableEdit(id, currentText) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const textCell = row.querySelector('.item-text');
        
        textCell.innerHTML = `
            <input type="text" class="edit-input" value="${currentText}">
            <button onclick="saveEdit(${id})">Save</button>
            <button onclick="cancelEdit(${id}, '${currentText}')">Cancel</button>
        `;
    }

    async function saveEdit(id) {
        const newText = document.querySelector(`tr[data-id="${id}"] .edit-input`).value.trim();
        
        if (newText) {
            try {
                const response = await fetch(`/items/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newText })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating item');
            }
        }
    }

    function cancelEdit(id, originalText) {
        const row = document.querySelector(`tr[data-id="${id}"]`);
        const textCell = row.querySelector('.item-text');
        textCell.innerHTML = originalText;
    }
</script>

</body>
</html>
